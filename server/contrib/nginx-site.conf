# nginx server block for serving the generated site in build/ as static files.
# (For the live-server mode instead, proxy_pass to 127.0.0.1:8080.)
server {
    server_name nunosempere.com;
    access_log /var/log/nginx/nunosempere.com.log;

    root /home/www/nunosempere.com/build;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nunosempere.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nunosempere.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = nunosempere.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name nunosempere.com;
    return 404; # managed by Certbot
}
